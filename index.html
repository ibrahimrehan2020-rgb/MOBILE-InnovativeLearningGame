<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BRAIN-STORM</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: white;
    text-align: center;
}

h1 {
    margin: 15px;
    color: #38bdf8;
}

#container {
    max-width: 800px;
    margin: auto;
    padding: 15px;
}

.card {
    background: #1e293b;
    padding: 20px;
    border-radius: 12px;
    margin-top: 20px;
}

button {
    width: 100%;
    padding: 12px;
    margin: 6px 0;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    background: #334155;
    color: white;
}

button:hover {
    background: #475569;
}

/* IMPORTANT FIX: scrollable options */
#options {
    max-height: 250px;
    overflow-y: auto;
    padding-right: 5px;
}

#question {
    font-size: 18px;
    margin-bottom: 10px;
}

.hidden {
    display: none;
}

#startBtn {
    background: #22c55e;
}
</style>
</head>

<body>

<h1>BRAIN-STORM</h1>

<div id="container">

<div id="startScreen" class="card">
    <h2>Start Your Exam</h2>
    <button id="startBtn">Start</button>
</div>

<div id="quizScreen" class="card hidden">
    <div id="question"></div>
    <div id="options"></div>
</div>

<div id="endScreen" class="card hidden">
    <h2>Finished</h2>
    <p id="score"></p>
    <button onclick="location.reload()">Restart</button>
</div>

</div>

<script>

/* =======================
   YOUR EXACT QUESTIONS (UNCHANGED)
======================= */

const questions = [

/* CHAPTER 4 */
{ q: "Marketing Research is defined as:", o: ["Systematic gathering, recording and analyzing of data", "Random guessing of markets", "Only advertising", "Selling products directly"], a: 0 },
{ q: "Marketing research helps in:", o: ["Ignoring customers", "Understanding marketing problems", "Reducing products", "Stopping competition"], a: 1 },
{ q: "Marketing research role is to provide:", o: ["First-hand knowledge", "Only profit data", "Only advertising ideas", "Employee salaries"], a: 0 },
{ q: "Marketing research is needed because:", o: ["Markets are stable", "Consumer demand changes", "No competition", "No customers"], a: 1 },
{ q: "Marketing research process starts with:", o: ["Data collection", "Define problem", "Reporting", "Analysis"], a: 1 },

/* CHAPTER 5 */
{ q: "Marketing mix is also called:", o: ["4Ps", "2Ps", "7Cs", "5Ws"], a: 0 },
{ q: "The 4Ps are:", o: ["Product, Price, Place, Promotion", "People, Price, Plan, Profit", "Place, Plan, Product, Profit", "Promotion, Product, Process, People"], a: 0 },
{ q: "Product means:", o: ["Anything offered to a market", "Only physical goods", "Only services", "Only brands"], a: 0 },
{ q: "Price means:", o: ["Money charged", "Product design", "Advertising", "Distribution"], a: 0 },
{ q: "Place refers to:", o: ["Distribution", "Promotion", "Price", "Product"], a: 0 },

/* CHAPTER 6 */
{ q: "Price is:", o: ["Amount of money charged", "Product design", "Promotion", "Place"], a: 0 },
{ q: "Price influences:", o: ["Consumer purchase decisions", "Weather", "Sports", "Politics"], a: 0 },
{ q: "Cost-based pricing is:", o: ["Cost plus profit margin", "Based on competition", "Based on emotions", "Random pricing"], a: 0 },
{ q: "Value-based pricing depends on:", o: ["Customer perception", "Cost only", "Competitors only", "Random choice"], a: 0 },
{ q: "Competition-based pricing depends on:", o: ["Competitor prices", "Cost only", "Product design", "Employees"], a: 0 }

];

let i = 0;
let score = 0;

const startScreen = document.getElementById("startScreen");
const quizScreen = document.getElementById("quizScreen");
const endScreen = document.getElementById("endScreen");

const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");

document.getElementById("startBtn").onclick = startGame;

function startGame() {
    startScreen.classList.add("hidden");
    quizScreen.classList.remove("hidden");
    loadQuestion();
}

function loadQuestion() {
    let q = questions[i];
    questionEl.innerText = q.q;

    optionsEl.innerHTML = "";

    q.o.forEach((opt, idx) => {
        let btn = document.createElement("button");
        btn.innerText = opt;
        btn.onclick = () => check(idx);
        optionsEl.appendChild(btn);
    });
}

function check(ans) {
    if (ans === questions[i].a) score++;

    i++;

    if (i < questions.length) {
        loadQuestion();
    } else {
        end();
    }
}

function end() {
    quizScreen.classList.add("hidden");
    endScreen.classList.remove("hidden");
    document.getElementById("score").innerText =
        "Score: " + score + " / " + questions.length;
}

</script>

</body>
</html>
