const AU = new (window.AudioContext || window.webkitAudioContext)();

function sfx(f, t, type='square', v=0.1) {
    try {
        const osc = AU.createOscillator();
        const gain = AU.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(f, AU.currentTime);

        gain.gain.setValueAtTime(v, AU.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, AU.currentTime + t);

        osc.connect(gain);
        gain.connect(AU.destination);

        osc.start();
        osc.stop(AU.currentTime + t);

    } catch(e){}
}

const gCanvas = document.getElementById('gameCanvas');
const bCanvas = document.getElementById('bgCanvas');

const gctx = gCanvas.getContext('2d');
const bctx = bCanvas.getContext('2d');

function resize() {

    const height = window.visualViewport
        ? window.visualViewport.height
        : window.innerHeight;

    const width = window.visualViewport
        ? window.visualViewport.width
        : window.innerWidth;

    gCanvas.width = width;
    gCanvas.height = height;

    bCanvas.width = width;
    bCanvas.height = height;

    drawStars();
}

window.addEventListener('resize', resize);

if(window.visualViewport){
    window.visualViewport.addEventListener('resize', resize);
}

resize();

function drawStars() {

    bctx.fillStyle = '#000';
    bctx.fillRect(0,0,bCanvas.width,bCanvas.height);

    for(let i=0;i<80;i++){

        bctx.fillStyle = `rgba(255,255,255,${Math.random()})`;

        bctx.beginPath();

        bctx.arc(
            Math.random()*bCanvas.width,
            Math.random()*bCanvas.height,
            Math.random()*1.5,
            0,
            Math.PI*2
        );

        bctx.fill();
    }
}

async function toggleFullscreen() {

    const elem = document.documentElement;

    try {

        if (
            document.fullscreenElement ||
            document.webkitFullscreenElement ||
            document.msFullscreenElement
        ) {

            if (document.exitFullscreen) {
                await document.exitFullscreen();
            }
            else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
            else if (document.msExitFullscreen) {
                document.msExitFullscreen();
            }

        } else {

            if (elem.requestFullscreen) {
                await elem.requestFullscreen();
            }
            else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            }
            else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }

            document.body.style.height = "100vh";
            document.documentElement.style.height = "100vh";
            document.body.style.overflow = "hidden";

            setTimeout(() => {
                window.scrollTo(0,1);
            },300);
        }

    } catch(err) {

        console.log(err);

        document.body.style.height = "100vh";
        document.documentElement.style.height = "100vh";
        document.body.style.overflow = "hidden";

        setTimeout(() => {
            window.scrollTo(0,1);
        },300);
    }

    setTimeout(resize,500);
}

function showScreen(id){

    document.querySelectorAll('.screen').forEach(s=>{
        s.classList.remove('active');
    });

    if(id){
        document.getElementById(id).classList.add('active');
    }

    document.getElementById('ui-layer').style.pointerEvents =
        id ? 'auto' : 'none';

    document.getElementById('mobile-controls').style.display =
        id ? 'none' : 'flex';
}

function startGame(){

    AU.resume();

    showScreen(null);

    document.getElementById('hud').style.display = 'flex';

    resize();

    randomQuestion();
}

function randomQuestion(){

    const q = questions[Math.floor(Math.random()*questions.length)];

    setTimeout(()=>{

        showScreen('quiz-screen');

        document.getElementById('q-text').innerText = q.q;

        const box = document.getElementById('opt-box');

        box.innerHTML = '';

        q.o.forEach((opt,i)=>{

            const b = document.createElement('button');

            b.className = 'opt-btn';

            b.innerText = opt;

            b.onclick = ()=>{

                if(i === q.a){

                    sfx(1200,0.2);

                    showScreen(null);

                } else {

                    sfx(50,0.4,'sawtooth');

                    alert("Wrong Answer");

                    showScreen(null);
                }
            };

            box.appendChild(b);

        });

    },1500);
}
