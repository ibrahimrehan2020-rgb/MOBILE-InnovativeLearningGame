<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BRAIN-STORM</title>
    <style>
        :root {
            --bg-void: #000000; 
            --card-bg: rgba(13, 17, 23, 0.98);
            --cyan: #00f2ff;
            --text: #e6edf3;
            --danger: #ff4d4d;
            --success: #00ff88;
            --platform: #161b22;
            --platform-border: #30363d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body { background: #111; color: var(--text); overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; margin: 0; }

        #viewport-wrapper {
            position: relative; width: 100%; height: 100%; transition: all 0.3s ease;
            background: var(--bg-void); overflow: hidden; display: flex; justify-content: center; align-items: center;
        }

        .mobile-mode {
            width: 844px !important; height: 390px !important; 
            border: 12px solid #222; border-radius: 30px; box-shadow: 0 0 60px rgba(0,0,0,0.9);
        }

        #canvas-container { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
        canvas { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #bgCanvas { z-index: 1; }
        #gameCanvas { z-index: 2; }

        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; justify-content: center; align-items: center; z-index: 100; }
        
        .screen { 
            pointer-events: auto; display: none; flex-direction: column; gap: 8px; 
            background: var(--card-bg); border: 1px solid var(--platform-border); 
            border-radius: 16px; padding: 15px; width: 95%; max-width: 450px; 
            backdrop-filter: blur(15px); box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            max-height: 90%; overflow-y: auto;
        }
        .screen.active { display: flex; animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        h1 { color: var(--cyan); text-align: center; letter-spacing: 2px; font-size: 1.4rem; margin-bottom: 2px; }
        h2 { color: var(--cyan); text-align: center; font-size: 1.1rem; }
        p { font-size: 0.85rem; text-align: center; }
        
        input { width: 100%; padding: 10px; background: rgba(0,0,0,0.8); border: 1px solid var(--platform-border); border-radius: 8px; color: white; text-align: center; font-size: 0.9rem; outline: none; }
        
        .btn { background: var(--cyan); color: #000; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.85rem; }
        .btn-secondary { background: transparent; border: 1px solid var(--platform-border); color: var(--text); padding: 8px; font-size: 0.8rem; }
        
        #hud { position: absolute; top: 10px; left: 15px; right: 15px; display: none; justify-content: space-between; align-items: center; font-size: 0.7rem; z-index: 10; pointer-events: none; font-weight: bold; }
        #hud-left, #hud-right { display: flex; gap: 8px; pointer-events: none; }
        #hud span, #hud button { pointer-events: auto; background: rgba(13, 17, 23, 0.8); padding: 5px 10px; border-radius: 6px; border: 1px solid var(--platform-border); color: var(--text); }
        #hud button { cursor: pointer; font-size: 0.65rem; color: var(--danger); border: 1px solid var(--danger); }

        .opt-box { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .opt-btn { background: rgba(33, 38, 45, 0.9); border: 1px solid var(--platform-border); color: white; padding: 8px; border-radius: 8px; text-align: center; font-size: 0.75rem; cursor: pointer; }
        .opt-btn:active { background: var(--cyan); color: #000; }

        #mobile-controls { position: absolute; bottom: 15px; left: 20px; right: 20px; display: none; justify-content: space-between; align-items: flex-end; z-index: 150; pointer-events: none; }
        .ctrl-btn { width: 55px; height: 55px; background: rgba(0,242,255,0.1); border: 2px solid var(--cyan); border-radius: 50%; color: var(--cyan); display: flex; justify-content: center; align-items: center; pointer-events: auto; font-size: 1.2rem; cursor: pointer; touch-action: none; }
    </style>
</head>
<body>

<div id="viewport-wrapper">
    <div id="canvas-container">
        <canvas id="bgCanvas"></canvas>
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="hud">
        <div id="hud-left">
            <span>USER: <span id="hud-user" style="color:var(--cyan)"></span></span>
            <span>LIVES: <span id="hud-lives" style="color:var(--danger)">3</span></span>
        </div>
        <div id="hud-right">
            <span>SECTOR: <span id="hud-level" style="color:var(--cyan)">1</span></span>
            <button onclick="exitToMenu()">LOGOUT</button>
        </div>
    </div>

    <div id="ui-layer">
        <div id="menu-screen" class="screen active">
            <h1>BRAIN-STORM</h1>
            <input type="text" id="username" placeholder="Enter Username..." maxlength="12">
            <button class="btn" onclick="startGame()">Start Mission</button>
            <button class="btn btn-secondary" onclick="showScreen('how-to')">How to Play</button>
            <button class="btn btn-secondary" onclick="showScreen('credits')">Credits</button>
        </div>

        <div id="how-to" class="screen">
            <h2>SYSTEM GUIDE</h2>
            <div style="margin: 5px 0; text-align: left; padding-left: 15px;">
                <p>• Move with <b>← →</b> Arrows</p>
                <p>• <b>↑</b> to Jump / Double Jump</p>
                <p>• Lose all lives? <b>Back to Start + New Level</b></p>
                <p>• Answer a Question? <b>New Level Layout</b></p>
            </div>
            <button class="btn" onclick="showScreen('menu-screen')">Back to Menu</button>
        </div>

        <div id="credits" class="screen">
            <h2>CREDITS</h2>
            <div style="padding: 10px 0;">
                <p style="font-size: 1.1rem; color: var(--cyan);">Muhammad Rehan Shaukat</p>
                <p style="color: #8b949e; font-size: 0.85rem;">Lecturer IN UTAS</p>
            </div>
            <button class="btn btn-secondary" onclick="showScreen('menu-screen')">Back</button>
        </div>

        <div id="quiz-screen" class="screen">
            <h2>SECURITY CHECK</h2>
            <p id="q-text" style="margin: 8px 0; font-weight: bold;"></p>
            <div id="opt-box" class="opt-box"></div>
        </div>
    </div>

    <div id="mobile-controls">
        <div style="display:flex; gap:15px;">
            <div class="ctrl-btn" id="btn-left">←</div>
            <div class="ctrl-btn" id="btn-right">→</div>
        </div>
        <div class="ctrl-btn" id="btn-up" style="border-color:var(--success); color:var(--success);">↑</div>
    </div>
</div>

<script>
    // [MCQ Data Kept Exactly the Same]
    const questions = [
        { q: "What is the Latin root of the word Market?", o: ["Mercatus", "Mercato", "Tradeus", "Marketus"], a: 0 },
        { q: "In Latin, 'Mercatus' literally means what?", o: ["To Buy", "To Sell", "To Trade", "To Exchange"], a: 2 },
        { q: "A 'Market' in common parlance is a place where buyers and sellers meet to:", o: ["Socialize", "Affect purchase and sales", "Discuss prices", "Trade secrets"], a: 1 },
        { q: "For marketing students, a market is a region where forces of demand and ______ operate.", o: ["Supply", "Profit", "Quality", "Competition"], a: 0 },
        { q: "Marketing is the process of discovering and translating wants into:", o: ["Profits", "Product specifications", "Advertisements", "High prices"], a: 1 },
        { q: "Which term describes goods, services, ideas, persons, or places being marketed?", o: ["Offering", "Asset", "Product", "Commodity"], a: 2 },
        { q: "What is a combination of products, services, and information offered to satisfy a need?", o: ["Market Offering", "Sales Pitch", "Trade Deal", "Business Plan"], a: 0 },
        { q: "The individual or organization that actually makes a purchase decision is the:", o: ["Consumer", "Target", "Customer", "User"], a: 2 },
        { q: "A 'Consumer' is defined as the individual who actually:", o: ["Pays the bill", "Signs the contract", "Uses the product", "Sells the product"], a: 2 },
        { q: "In a household, if a parent buys toys for a child, who is the 'Customer'?", o: ["The Child", "The Store", "The Parent", "The Toy Company"], a: 2 },
        { q: "In the same household toy scenario, who is the 'Consumer'?", o: ["The Parent", "The Store", "The Child", "The Manufacturer"], a: 2 },
        { q: "Marketing is a total system of business activities designed to plan, price, promote, and:", o: ["Distribute", "Inventory", "Manufacture", "Recruit"], a: 0 },
        { q: "Organization marketing aims to change attitudes toward:", o: ["A specific person", "An organization", "A city", "A global cause"], a: 1 },
        { q: "Marketing designed to influence behavior to improve society's well-being is:", o: ["Commercial marketing", "Profit marketing", "Social marketing", "Retail marketing"], a: 2 },
        { q: "Which type of marketing focuses on attitudes toward particular places?", o: ["Place marketing", "Person marketing", "Area marketing", "Global marketing"], a: 0 },
        { q: "Person marketing is undertaken to change behavior toward:", o: ["Groups of people", "Particular people", "Competitors", "Celebrities only"], a: 1 },
        { q: "Marketing is considered both a technology and a:", o: ["Religion", "Hobby", "Philosophy", "Expense"], a: 2 },
        { q: "As a technology, marketing is concerned with:", o: ["What should be produced", "Hiring staff", "Fixing machines", "Writing code"], a: 0 },
        { q: "As a philosophy, marketing guides:", o: ["Factory speed", "Business thinking", "Legal battles", "Stock prices"], a: 1 },
        { q: "The 'Marketing Process' is a matching process between producers and:", o: ["Governments", "Investors", "Consumers", "Advertisers"], a: 2 },
        { q: "What provides the link to bring about transfer in the title of goods?", o: ["The Market", "The Factory", "The Warehouse", "The Bank"], a: 0 },
        { q: "In 'Selling,' the primary emphasis is on:", o: ["Customers' wants", "The product", "Future growth", "Market research"], a: 1 },
        { q: "In 'Marketing,' the primary emphasis is on:", o: ["Customers' wants", "Sales volume", "Factory capacity", "Product features"], a: 0 },
        { q: "A 'Selling' oriented company first makes the product and then figures out how to:", o: ["Improve it", "Sell it", "Destroy it", "Store it"], a: 1 },
        { q: "A 'Marketing' oriented company first determines wants and then figures out how to:", o: ["Raise prices", "Lower taxes", "Satisfy those wants", "Hire more staff"], a: 2 },
        { q: "Management in 'Selling' is primarily:", o: ["Quality oriented", "Service oriented", "Sales volume oriented", "Relationship oriented"], a: 2 },
        { q: "Management in 'Marketing' is primarily:", o: ["Profit oriented", "Inventory oriented", "Labor oriented", "Cost oriented"], a: 0 },
        { q: "Planning in 'Selling' is usually:", o: ["Long-run oriented", "Short-run oriented", "Socially oriented", "Never done"], a: 1 },
        { q: "Planning in 'Marketing' is usually:", o: ["Short-run oriented", "Long-run oriented", "Locally oriented", "Only daily"], a: 1 },
        { q: "Selling stresses the needs of the:", o: ["Buyer", "Seller", "Government", "Community"], a: 1 },
        { q: "Marketing stresses the wants of the:", o: ["Seller", "Manager", "Buyer", "Manufacturer"], a: 2 },
        { q: "Which stage of evolution involved each family being totally self-reliant?", o: ["Exchange stage", "Self-sufficient stage", "Sales stage", "Management stage"], a: 1 },
        { q: "During the self-sufficient stage, humans were primarily:", o: ["Factory workers", "Hunters or food gatherers", "Bankers", "Teachers"], a: 1 },
        { q: "Was there a scope for exchange in the self-sufficient stage?", o: ["Yes", "No", "Only for food", "Only for tools"], a: 1 },
        { q: "Which stage saw the beginning of the 'Division of Labor'?", o: ["Self-sufficient", "Exchange-oriented", "Production", "Sales"], a: 1 },
        { q: "Surplus goods were first traded via which system?", o: ["Credit cards", "Barter system", "Bitcoin", "Gold standard"], a: 1 },
        { q: "The barter system is described as being:", o: ["Fast", "Tedious and time-consuming", "Only for modern cities", "High tech"], a: 1 },
        { q: "Which stage began with the Industrial Revolution?", o: ["Exchange", "Production-oriented", "Social", "Digital"], a: 1 },
        { q: "The production-oriented stage assumes no ______ efforts are necessary.", o: ["Safety", "Legal", "Promotion", "Accounting"], a: 2 },
        { q: "Companies practicing the production concept today are usually:", o: ["Small startups", "Monopolies", "Non-profits", "Farmers"], a: 1 },
        { q: "Which stage saw a shift from agriculture to industry?", o: ["Self-sufficient", "Sales-oriented", "Primitive", "Barter"], a: 1 },
        { q: "The 'Selling Concept' belongs to which stage?", o: ["Production", "Sales-oriented", "Management", "Social"], a: 1 },
        { q: "In the Selling Concept, it is assumed consumers will not buy enough without:", o: ["Lower prices", "Incentive sales promotion", "Better quality", "New colors"], a: 1 },
        { q: "The Selling Concept places greater emphasis on ______ than on customer needs.", o: ["Increasing sales", "Employee health", "Saving environment", "Research"], a: 0 },
        { q: "In which stage did production capacity and consumer demand reach equilibrium?", o: ["Sales stage", "Marketing-oriented", "Barter stage", "Primitive"], a: 1 },
        { q: "Which stage is known as the 'Modern concept of marketing'?", o: ["Production", "Consumer-oriented", "Exchange", "Self-sufficient"], a: 1 },
        { q: "In the Consumer-oriented stage, the philosophy is 'consumer and his ______.'", o: ["Money", "Satisfaction", "Location", "Family"], a: 1 },
        { q: "In the Consumer-oriented stage, production was:", o: ["Non-existent", "Excess of demand", "Equal to demand", "Half of demand"], a: 1 },
        { q: "Today, marketing is planned, organized, staffed, and:", o: ["Ignored", "Controlled", "Deleted", "Taxed"], a: 1 },
        { q: "In the Sales-oriented stage, the rise in what changed consumer behavior?", o: ["Living standards", "Sea levels", "Interest rates", "Taxes"], a: 0 },
        { q: "Which stage believes consumers will choose quality, performance, and innovation?", o: ["Product concept", "Selling concept", "Barter concept", "Self-sufficient"], a: 0 },
        { q: "Marketing is both a philosophy and a...?", o: ["Science", "Art", "Technology", "Business"], a: 2 },
        { q: "A parent making a purchase decision is the:", o: ["Consumer", "Customer", "Producer", "Seller"], a: 1 }
    ];

    const wrapper = document.getElementById('viewport-wrapper');
    function setView() { if (window.innerWidth > 600) wrapper.classList.add('mobile-mode'); resize(); }
    window.addEventListener('load', setView);

    let AU;
    function initAudio() { if (!AU) AU = new (window.AudioContext || window.webkitAudioContext)(); if (AU.state === 'suspended') AU.resume(); }
    function sfx(f, t) { if(!AU) return; try { const o=AU.createOscillator(); const g=AU.createGain(); o.frequency.setValueAtTime(f, AU.currentTime); g.gain.exponentialRampToValueAtTime(0.01, AU.currentTime+t); o.connect(g); g.connect(AU.destination); o.start(); o.stop(AU.currentTime+t); } catch(e){} }

    const gCanvas = document.getElementById('gameCanvas'), bCanvas = document.getElementById('bgCanvas');
    const gctx = gCanvas.getContext('2d'), bctx = bCanvas.getContext('2d');

    let state = 'MENU', lives = 3, sector = 1, cameraX = 0, username = "";
    let checkpoint = { x: 100, y: 100 };
    let player = { x: 100, y: 0, w: 26, h: 26, dx: 0, dy: 0, speed: 6, gravity: 0.6, jPower: -12, grounded: false, canDJ: true, trail: [], lastFace: 1 };
    let platforms = [], spikes = [], flags = [], goal = { x: 0 };
    let keys = { left: false, right: false };
    let loopID;

    function resize() { 
        const r = wrapper.getBoundingClientRect();
        gCanvas.width = bCanvas.width = r.width; 
        gCanvas.height = bCanvas.height = r.height; 
        drawStars(); 
    }
    window.addEventListener('resize', resize);

    function jump() {
        if(player.grounded) { player.dy = player.jPower; player.grounded = false; player.canDJ = true; sfx(400, 0.1); }
        else if(player.canDJ) { player.dy = player.jPower * 0.85; player.canDJ = false; sfx(600, 0.1); }
    }

    const setupBtn = (id, action, stopAction) => {
        const el = document.getElementById(id);
        const start = (e) => { e.preventDefault(); initAudio(); action(); };
        const end = (e) => { e.preventDefault(); if(stopAction) stopAction(); };
        el.addEventListener('mousedown', start); el.addEventListener('mouseup', end);
        el.addEventListener('touchstart', start, {passive:false}); el.addEventListener('touchend', end, {passive:false});
    };

    setupBtn('btn-left', () => { keys.left = true; player.lastFace = -1; }, () => { keys.left = false; });
    setupBtn('btn-right', () => { keys.right = true; player.lastFace = 1; }, () => { keys.right = false; });
    setupBtn('btn-up', () => { jump(); }, null);

    window.addEventListener('keydown', e => { 
        if(e.code==='ArrowLeft'||e.code==='KeyA') { keys.left=true; player.lastFace=-1; } 
        if(e.code==='ArrowRight'||e.code==='KeyD') { keys.right=true; player.lastFace=1; } 
        if(e.code==='ArrowUp'||e.code==='Space'||e.code==='KeyW') jump(); 
    });
    window.addEventListener('keyup', e => { if(e.code==='ArrowLeft'||e.code==='KeyA') keys.left=false; if(e.code==='ArrowRight'||e.code==='KeyD') keys.right=false; });

    function drawStars() {
        bctx.fillStyle = '#000'; bctx.fillRect(0,0,bCanvas.width, bCanvas.height);
        bctx.fillStyle = '#fff'; for(let i=0; i<120; i++) bctx.fillRect(Math.random()*bCanvas.width, Math.random()*bCanvas.height, 1.2, 1.2);
    }

    function generateLevel() {
        platforms = [{ x: 0, y: gCanvas.height-60, w: 400, h: 60 }];
        spikes = []; flags = [];
        let cx = 400;
        
        for(let i=0; i<35; i++) {
            let w = 110+Math.random()*150, gap = 80+Math.random()*75;
            let y = gCanvas.height-(100+Math.random()*120);
            if(y < 70) y = 70;
            
            platforms.push({ x: cx+gap, y: y, w: w, h: 28 });
            
            if(Math.random() < 0.5) {
                let spikeCount = Math.floor(Math.random() * 2) + 1;
                for(let j=0; j<spikeCount; j++) {
                    spikes.push({x: cx+gap + (j*40) + (w/4), y: y-20, w: 30, h: 20});
                }
            }

            if(i > 0 && i % 7 === 0) {
                flags.push({x: cx+gap + 10, y: y-40, w: 20, h: 40, active: false});
            }
            
            cx += gap + w;
        }
        
        goal.x = cx + 50;
        checkpoint = { x: 100, y: 100 };
        respawnPlayer();
    }

    function respawnPlayer() {
        player.x = checkpoint.x; player.y = checkpoint.y;
        player.dx = 0; player.dy = 0;
        cameraX = player.x - gCanvas.width/3;
    }

    function handleDeath() { 
        lives--; 
        updateHUD(); 
        sfx(100, 0.2); 

        if(lives <= 0) {
            // THE BIG RESET: 3 Lives lost -> Start of Game + New Layout
            lives = 3;
            updateHUD();
            generateLevel(); 
        } else {
            // Normal Respawn: Back to Checkpoint
            respawnPlayer();
        }
    }

    function loop() {
        if(state !== 'PLAYING') return;
        
        if(keys.left) player.dx = -player.speed; 
        else if(keys.right) player.dx = player.speed; 
        else player.dx *= 0.8;
        
        player.dy += player.gravity; player.x += player.dx; player.y += player.dy;
        player.trail.push({x: player.x, y: player.y}); if(player.trail.length > 8) player.trail.shift();
        player.grounded = false;
        
        platforms.forEach(p => { 
            if(player.x < p.x + p.w && player.x + player.w > p.x && player.y + player.h > p.y && player.y + player.h < p.y + p.h + 10) { 
                if(player.dy > 0) { player.y = p.y - player.h; player.dy = 0; player.grounded = true; player.canDJ = true; } 
            } 
        });

        spikes.forEach(s => { 
            if(player.x < s.x + s.w - 5 && player.x + player.w > s.x + 5 && player.y < s.y + s.h && player.y + player.h > s.y + 5) handleDeath(); 
        });

        flags.forEach(f => {
            if(!f.active && player.x < f.x + f.w && player.x + player.w > f.x && player.y < f.y + f.h && player.y + player.h > f.y) {
                flags.forEach(o => o.active = false);
                f.active = true;
                checkpoint = { x: f.x, y: f.y - 10 };
                sfx(800, 0.1);
            }
        });

        if(player.y > gCanvas.height + 150) handleDeath();
        if(player.x + player.w >= goal.x) triggerQuiz();

        cameraX += ((player.x - gCanvas.width/3) - cameraX) * 0.1;
        render(); loopID = requestAnimationFrame(loop);
    }

    function render() {
        gctx.clearRect(0,0, gCanvas.width, gCanvas.height);
        gctx.save(); gctx.translate(-cameraX, 0);
        
        gctx.fillStyle = '#161b22'; platforms.forEach(p => gctx.fillRect(p.x, p.y, p.w, p.h));
        gctx.fillStyle = '#ff4d4d'; spikes.forEach(s => { gctx.beginPath(); gctx.moveTo(s.x, s.y+s.h); gctx.lineTo(s.x+s.w/2, s.y); gctx.lineTo(s.x+s.w, s.y+s.h); gctx.fill(); });
        
        flags.forEach(f => {
            gctx.fillStyle = '#333'; gctx.fillRect(f.x, f.y, 4, f.h);
            gctx.fillStyle = f.active ? '#00f2ff' : '#00ff88';
            gctx.beginPath(); gctx.moveTo(f.x+4, f.y); gctx.lineTo(f.x+20, f.y+10); gctx.lineTo(f.x+4, f.y+20); gctx.fill();
        });

        gctx.fillStyle = '#00f2ff'; gctx.fillRect(goal.x, 0, 15, gCanvas.height);
        gctx.shadowBlur = 15; gctx.shadowColor = "#00f2ff"; gctx.fillRect(goal.x, 0, 15, gCanvas.height); gctx.shadowBlur = 0;

        player.trail.forEach((t, i) => { gctx.globalAlpha = i/15; gctx.fillStyle = '#00f2ff'; gctx.fillRect(t.x, t.y, player.w, player.h); });
        gctx.globalAlpha = 1; gctx.fillStyle = '#00f2ff'; gctx.fillRect(player.x, player.y, player.w, player.h);
        gctx.fillStyle = '#000'; gctx.fillRect(player.lastFace === 1 ? player.x + 16 : player.x + 4, player.y + 6, 6, 6);
        
        gctx.restore();
    }

    function startGame() {
        initAudio(); 
        username = document.getElementById('username').value.trim() || "REHAN";
        lives = 3; sector = 1;
        document.getElementById('hud').style.display = 'flex';
        document.getElementById('mobile-controls').style.display = 'flex';
        state = 'PLAYING'; generateLevel(); updateHUD(); 
        cancelAnimationFrame(loopID); loop(); showScreen(null);
    }

    function exitToMenu() {
        state = 'MENU'; cancelAnimationFrame(loopID);
        document.getElementById('hud').style.display = 'none';
        document.getElementById('mobile-controls').style.display = 'none';
        showScreen('menu-screen');
    }

    function triggerQuiz() {
        state = 'QUIZ'; showScreen('quiz-screen');
        const q = questions[Math.floor(Math.random()*questions.length)];
        document.getElementById('q-text').innerText = q.q;
        const box = document.getElementById('opt-box'); box.innerHTML = '';
        q.o.forEach((opt, i) => {
            const b = document.createElement('div'); b.className = 'opt-btn'; b.innerText = opt;
            b.onclick = () => { 
                if(i === q.a) { 
                    sector++; 
                } else { 
                    lives--; 
                    if(lives <= 0) lives = 3; // Reset lives for new run
                } 
                // Level ALWAYS regenerates after quiz
                state = 'PLAYING'; generateLevel(); updateHUD(); showScreen(null); loop(); 
            };
            box.appendChild(b);
        });
    }

    function updateHUD() { document.getElementById('hud-user').innerText = username; document.getElementById('hud-level').innerText = sector; document.getElementById('hud-lives').innerText = lives; }
    function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); if(id) document.getElementById(id).classList.add('active'); }
</script>
</body>
</html>
