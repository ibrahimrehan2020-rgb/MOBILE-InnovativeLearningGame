<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BRAIN-STORM">
    <meta name="mobile-web-app-capable" content="yes">
    
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/5653/5653434.png">
    
    <title>BRAIN-STORM</title>
    
    <style>
        :root {
            --cyan: #00f2ff;
            --bg: #000;
            --text: #fff;
            --border: #333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; }

        #viewport-wrapper { position: relative; width: 100%; height: 100%; overflow: hidden; }
        canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
        #bgCanvas { z-index: 1; }
        #gameCanvas { z-index: 2; }

        #ui-layer { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; z-index: 100; pointer-events: none; }
        .screen { 
            pointer-events: auto; display: none; flex-direction: column; gap: 12px; 
            background: rgba(10, 10, 15, 0.98); border: 1px solid var(--border); 
            border-radius: 15px; padding: 25px; width: 85%; max-width: 350px; 
            backdrop-filter: blur(10px); text-align: center;
        }
        .screen.active { display: flex; animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        h1 { color: var(--cyan); font-size: 1.8rem; text-shadow: 0 0 15px var(--cyan); margin-bottom: 5px; }
        input { width: 100%; padding: 12px; background: #111; border: 1px solid var(--border); border-radius: 8px; color: #fff; text-align: center; }
        
        .btn { background: var(--cyan); color: #000; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-install { background: #ffcc00; color: #000; border: 2px solid #fff; }
        .btn-sec { background: transparent; border: 1px solid var(--border); color: #aaa; font-size: 0.8rem; }

        #hud { position: absolute; top: 15px; left: 15px; right: 15px; display: none; justify-content: space-between; z-index: 50; pointer-events: none; font-size: 0.75rem; }
        #hud span { background: rgba(0,0,0,0.8); padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border); }

        #mobile-controls { position: absolute; bottom: 30px; left: 20px; right: 20px; display: none; justify-content: space-between; z-index: 150; pointer-events: none; }
        .ctrl-btn { width: 70px; height: 70px; background: rgba(0,242,255,0.1); border: 2px solid var(--cyan); border-radius: 50%; color: var(--cyan); display: flex; justify-content: center; align-items: center; pointer-events: auto; font-size: 1.8rem; }

        /* Installation Instructions for iPhone */
        #ios-guide { font-size: 0.85rem; color: #ccc; border-top: 1px solid #333; padding-top: 10px; display: none; }
    </style>
</head>
<body>

<div id="viewport-wrapper">
    <canvas id="bgCanvas"></canvas>
    <canvas id="gameCanvas"></canvas>

    <div id="hud">
        <span>PLAYER: <b id="hud-user">...</b></span>
        <span>LIVES: <b id="hud-lives" style="color:#ff4d4d">3</b> | SEC: <b id="hud-level">1</b></span>
    </div>

    <div id="ui-layer">
        <div id="menu-screen" class="screen active">
            <h1>BRAIN-STORM</h1>
            <input type="text" id="username" placeholder="Username" maxlength="10">
            <button class="btn" id="start-btn">PLAY NOW</button>
            
            <button class="btn btn-install" id="install-btn">INSTALL TO HOME SCREEN</button>
            
            <div id="ios-guide">
                To Install on iPhone: <br>
                Tap <b>Share</b> (Square icon) <br>
                then <b>"Add to Home Screen"</b>
            </div>

            <button class="btn btn-sec" onclick="showScreen('credits')">CREDITS</button>
        </div>

        <div id="credits" class="screen">
            <h1>CREDITS</h1>
            <p>Created by:<br><b style="color:var(--cyan)">Muhammad Rehan Shaukat</b><br>Lecturer at UTAS</p>
            <button class="btn btn-sec" onclick="showScreen('menu-screen')">BACK</button>
        </div>

        <div id="quiz-screen" class="screen">
            <h2 id="q-text" style="font-size:1rem;">SECURITY VERIFICATION</h2>
            <div id="opt-box" style="display:grid; grid-template-columns:1fr 1fr; gap:10px;"></div>
        </div>
    </div>

    <div id="mobile-controls">
        <div style="display:flex; gap:25px;">
            <div class="ctrl-btn" id="btn-left">←</div>
            <div class="ctrl-btn" id="btn-right">→</div>
        </div>
        <div class="ctrl-btn" id="btn-up" style="border-color:#0f8; color:#0f8">↑</div>
    </div>
</div>

<script>
    // [Questions Kept - 50 total]
    const questions = [{q:"What is the Latin root of the word Market?", o:["Mercatus","Mercato","Tradeus","Marketus"], a:0},{q:"In Latin, 'Mercatus' literally means what?", o:["To Buy","To Sell","To Trade","To Exchange"], a:2},{q:"A 'Market' in common parlance is a place where buyers and sellers meet to:", o:["Socialize","Affect purchase and sales","Discuss prices","Trade secrets"], a:1},{q:"For marketing students, a market is a region where forces of demand and ______ operate.", o:["Supply","Profit","Quality","Competition"], a:0},{q:"Marketing is the process of discovering and translating wants into:", o:["Profits","Product specifications","Advertisements","High prices"], a:1},{q:"Which term describes goods, services, ideas, persons, or places being marketed?", o:["Offering","Asset","Product","Commodity"], a:2},{q:"What is a combination of products, services, and information offered to satisfy a need?", o:["Market Offering","Sales Pitch","Trade Deal","Business Plan"], a:0},{q:"The individual or organization that actually makes a purchase decision is the:", o:["Consumer","Target","Customer","User"], a:2},{q:"A 'Consumer' is defined as the individual who actually:", o:["Pays the bill","Signs the contract","Uses the product","Sells the product"], a:2},{q:"In a household, if a parent buys toys for a child, who is the 'Customer'?", o:["The Child","The Store","The Parent","The Toy Company"], a:2},{q:"In the same household toy scenario, who is the 'Consumer'?", o:["The Parent","The Store","The Child","The Manufacturer"], a:2},{q:"Marketing is a total system of business activities designed to plan, price, promote, and:", o:["Distribute","Inventory","Manufacture","Recruit"], a:0},{q:"Organization marketing aims to change attitudes toward:", o:["A specific person","An organization","A city","A global cause"], a:1},{q:"Marketing designed to influence behavior to improve society's well-being is:", o:["Commercial marketing","Profit marketing","Social marketing","Retail marketing"], a:2},{q:"Which type of marketing focuses on attitudes toward particular places?", o:["Place marketing","Person marketing","Area marketing","Global marketing"], a:0},{q:"Person marketing is undertaken to change behavior toward:", o:["Groups of people","Particular people","Competitors","Celebrities only"], a:1},{q:"Marketing is considered both a technology and a:", o:["Religion","Hobby","Philosophy","Expense"], a:2},{q:"As a technology, marketing is concerned with:", o:["What should be produced","Hiring staff","Fixing machines","Writing code"], a:0},{q:"As a philosophy, marketing guides:", o:["Factory speed","Business thinking","Legal battles","Stock prices"], a:1},{q:"The 'Marketing Process' is a matching process between producers and:", o:["Governments","Investors","Consumers","Advertisers"], a:2},{q:"What provides the link to bring about transfer in the title of goods?", o:["The Market","The Factory","The Warehouse","The Bank"], a:0},{q:"In 'Selling,' the primary emphasis is on:", o:["Customers' wants","The product","Future growth","Market research"], a:1},{q:"In 'Marketing,' the primary emphasis is on:", o:["Customers' wants","Sales volume","Factory capacity","Product features"], a:0},{q:"A 'Selling' oriented company first makes the product and then figures out how to:", o:["Improve it","Sell it","Destroy it","Store it"], a:1},{q:"A 'Marketing' oriented company first determines wants and then figures out how to:", o:["Raise prices","Lower taxes","Satisfy those wants","Hire more staff"], a:2},{q:"Management in 'Selling' is primarily:", o:["Quality oriented","Service oriented","Sales volume oriented","Relationship oriented"], a:2},{q:"Management in 'Marketing' is primarily:", o:["Profit oriented","Inventory oriented","Labor oriented","Cost oriented"], a:0},{q:"Planning in 'Selling' is usually:", o:["Long-run oriented","Short-run oriented","Socially oriented","Never done"], a:1},{q:"Planning in 'Marketing' is usually:", o:["Short-run oriented","Long-run oriented","Locally oriented","Only daily"], a:1},{q:"Selling stresses the needs of the:", o:["Buyer","Seller","Government","Community"], a:1},{q:"Marketing stresses the wants of the:", o:["Seller","Manager","Buyer","Manufacturer"], a:2},{q:"Which stage of evolution involved each family being totally self-reliant?", o:["Exchange stage","Self-sufficient stage","Sales stage","Management stage"], a:1},{q:"During the self-sufficient stage, humans were primarily:", o:["Factory workers","Hunters or food gatherers","Bankers","Teachers"], a:1},{q:"Was there a scope for exchange in the self-sufficient stage?", o:["Yes","No","Only for food","Only for tools"], a:1},{q:"Which stage saw the beginning of the 'Division of Labor'?", o:["Self-sufficient","Exchange-oriented","Production","Sales"], a:1},{q:"Surplus goods were first traded via which system?", o:["Credit cards","Barter system","Bitcoin","Gold standard"], a:1},{q:"The barter system is described as being:", o:["Fast","Tedious and time-consuming","Only for modern cities","High tech"], a:1},{q:"Which stage began with the Industrial Revolution?", o:["Exchange","Production-oriented","Social","Digital"], a:1},{q:"The production-oriented stage assumes no ______ efforts are necessary.", o:["Safety","Legal","Promotion","Accounting"], a:2},{q:"Companies practicing the production concept today are usually:", o:["Small startups","Monopolies","Non-profits","Farmers"], a:1},{q:"Which stage saw a shift from agriculture to industry?", o:["Self-sufficient","Sales-oriented","Primitive","Barter"], a:1},{q:"The 'Selling Concept' belongs to which stage?", o:["Production","Sales-oriented","Management","Social"], a:1},{q:"In the Selling Concept, it is assumed consumers will not buy enough without:", o:["Lower prices","Incentive sales promotion","Better quality","New colors"], a:1},{q:"The Selling Concept places greater emphasis on ______ than on customer needs.", o:["Increasing sales","Employee health","Saving environment","Research"], a:0},{q:"In which stage did production capacity and consumer demand reach equilibrium?", o:["Sales stage","Marketing-oriented","Barter stage","Primitive"], a:1},{q:"Which stage is known as the 'Modern concept of marketing'?", o:["Production","Consumer-oriented","Exchange","Self-sufficient"], a:1},{q:"In the Consumer-oriented stage, the philosophy is 'consumer and his ______.'", o:["Money","Satisfaction","Location","Family"], a:1},{q:"In the Consumer-oriented stage, production was:", o:["Non-existent","Excess of demand","Equal to demand","Half of demand"], a:1},{q:"Today, marketing is planned, organized, staffed, and:", o:["Ignored","Controlled","Deleted","Taxed"], a:1},{q:"In the Sales-oriented stage, the rise in what changed consumer behavior?", o:["Living standards","Sea levels","Interest rates","Taxes"], a:0},{q:"Which stage believes consumers will choose quality, performance, and innovation?", o:["Product concept","Selling concept","Barter concept","Self-sufficient"], a:0},{q:"Marketing is both a philosophy and a...?", o:["Science","Art","Technology","Business"], a:2},{q:"A parent making a purchase decision is the:", o:["Consumer","Customer","Producer","Seller"], a:1}];

    // INSTALLATION LOGIC
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        document.getElementById('install-btn').style.display = 'block';
    });

    document.getElementById('install-btn').onclick = async () => {
        if (navigator.userAgent.match(/iPhone|iPad|iPod/i)) {
            document.getElementById('ios-guide').style.display = 'block';
        } else if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') deferredPrompt = null;
        }
    };

    // GAME LOGIC
    const gCanvas = document.getElementById('gameCanvas'), gctx = gCanvas.getContext('2d');
    const bCanvas = document.getElementById('bgCanvas'), bctx = bCanvas.getContext('2d');
    let state = 'MENU', lives = 3, sector = 1, cameraX = 0, loopID, username = "REHAN";
    let player = { x: 100, y: 0, w: 26, h: 26, dx: 0, dy: 0, speed: 6, gravity: 0.6, jPower: -12, grounded: false, canDJ: true };
    let platforms = [], spikes = [], flags = [], goal = { x: 0 }, keys = { left: false, right: false };
    let checkpoint = { x: 100, y: 100 };

    function resize() { gCanvas.width = bCanvas.width = window.innerWidth; gCanvas.height = bCanvas.height = window.innerHeight; drawStars(); }
    window.addEventListener('resize', resize);
    window.onload = () => { resize(); if(localStorage.getItem('user')) document.getElementById('username').value = localStorage.getItem('user'); };

    function drawStars() { bctx.fillStyle = '#000'; bctx.fillRect(0,0,bCanvas.width, bCanvas.height); bctx.fillStyle = '#fff'; for(let i=0; i<80; i++) bctx.fillRect(Math.random()*bCanvas.width, Math.random()*bCanvas.height, 1, 1); }

    function generateLevel() {
        platforms = [{ x: 0, y: gCanvas.height-60, w: 500, h: 60 }]; spikes = []; flags = [];
        let cx = 500;
        for(let i=0; i<30; i++) {
            let w = 120+Math.random()*120, gap = 80+Math.random()*90, y = Math.max(80, gCanvas.height-(120+Math.random()*160));
            platforms.push({ x: cx+gap, y: y, w: w, h: 30 });
            if(Math.random()<0.4) spikes.push({x: cx+gap+(w/2)-15, y: y-20, w: 30, h: 20});
            if(i%6==0 && i>0) flags.push({x: cx+gap+10, y: y-40, active: false});
            cx += gap + w;
        }
        goal.x = cx + 150; respawn();
    }

    function respawn() { player.x = checkpoint.x; player.y = checkpoint.y; player.dx = player.dy = 0; cameraX = player.x - 100; }

    function startGame() {
        username = document.getElementById('username').value || "REHAN";
        localStorage.setItem('user', username);
        document.getElementById('hud-user').innerText = username;
        document.getElementById('hud').style.display = 'flex';
        document.getElementById('mobile-controls').style.display = 'flex';
        state = 'PLAYING';
        generateLevel();
        showScreen(null);
        loop();
    }

    function loop() {
        if(state !== 'PLAYING') return;
        player.dx = keys.left ? -player.speed : (keys.right ? player.speed : player.dx * 0.8);
        player.dy += player.gravity; player.x += player.dx; player.y += player.dy;
        player.grounded = false;
        platforms.forEach(p => { if(player.x < p.x + p.w && player.x + player.w > p.x && player.y + player.h > p.y && player.y + player.h < p.y + p.h + 10 && player.dy > 0) { player.y = p.y - player.h; player.dy = 0; player.grounded = true; player.canDJ = true; } });
        spikes.forEach(s => { if(player.x < s.x + s.w - 5 && player.x + player.w > s.x + 5 && player.y < s.y + s.h && player.y + player.h > s.y + 5) { lives--; checkpoint = {x:100,y:100}; respawn(); } });
        flags.forEach(f => { if(!f.active && player.x < f.x+20 && player.x+26 > f.x && player.y < f.y+40 && player.y+26 > f.y) { flags.forEach(fl=>fl.active=false); f.active=true; checkpoint={x:f.x, y:f.y}; } });
        if(player.y > gCanvas.height + 100) { lives--; respawn(); }
        if(player.x > goal.x) triggerQuiz();
        cameraX += ((player.x - 100) - cameraX) * 0.1;
        document.getElementById('hud-lives').innerText = lives;
        document.getElementById('hud-level').innerText = sector;
        render();
        loopID = requestAnimationFrame(loop);
    }

    function render() {
        gctx.clearRect(0,0, gCanvas.width, gCanvas.height);
        gctx.save(); gctx.translate(-cameraX, 0);
        gctx.fillStyle = '#161b22'; platforms.forEach(p => gctx.fillRect(p.x, p.y, p.w, p.h));
        gctx.fillStyle = '#ff4d4d'; spikes.forEach(s => { gctx.beginPath(); gctx.moveTo(s.x, s.y+20); gctx.lineTo(s.x+15, s.y); gctx.lineTo(s.x+30, s.y+20); gctx.fill(); });
        flags.forEach(f => { gctx.fillStyle = f.active ? '#0f8' : '#333'; gctx.fillRect(f.x, f.y, 5, 40); });
        gctx.fillStyle = var(--cyan); gctx.fillRect(player.x, player.y, player.w, player.h);
        gctx.fillStyle = var(--cyan); gctx.fillRect(goal.x, 0, 25, gCanvas.height);
        gctx.restore();
    }

    function triggerQuiz() {
        state = 'QUIZ'; showScreen('quiz-screen');
        const q = questions[Math.floor(Math.random()*questions.length)];
        document.getElementById('q-text').innerText = q.q;
        const box = document.getElementById('opt-box'); box.innerHTML = '';
        q.o.forEach((opt, i) => {
            const b = document.createElement('button'); b.className = 'btn btn-sec'; b.innerText = opt;
            b.onclick = () => { if(i==q.a) sector++; state='PLAYING'; generateLevel(); showScreen(null); loop(); };
            box.appendChild(b);
        });
    }

    function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); if(id) document.getElementById(id).classList.add('active'); }
    document.getElementById('start-btn').onclick = startGame;
    const bindBtn = (id, k) => { 
        document.getElementById(id).ontouchstart = (e) => { e.preventDefault(); keys[k] = true; if(k=='up') jump(); };
        document.getElementById(id).ontouchend = (e) => { e.preventDefault(); keys[k] = false; };
    };
    bindBtn('btn-left', 'left'); bindBtn('btn-right', 'right'); bindBtn('btn-up', 'up');
    function jump() { if(player.grounded) { player.dy = player.jPower; player.grounded = false; player.canDJ = true; } else if(player.canDJ) { player.dy = player.jPower; player.canDJ = false; } }
</script>
</body>
</html>
