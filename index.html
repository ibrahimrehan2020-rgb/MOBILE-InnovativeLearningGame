<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>BRAIN-STORM</title>

<style>

:root{
    --bg-void:#000000;
    --card-bg:rgba(13,17,23,0.98);
    --cyan:#00f2ff;
    --cyan-glow:rgba(0,242,255,0.6);
    --text:#e6edf3;
    --danger:#ff4d4d;
    --success:#00ff88;
    --platform:#161b22;
    --platform-border:#30363d;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Segoe UI',Roboto,sans-serif;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    background:var(--bg-void);
    color:var(--text);
    position:fixed;
    inset:0;
    touch-action:none;
}

#canvas-container{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#000;
}

canvas{
    display:block;
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

#bgCanvas{z-index:1;}
#gameCanvas{z-index:2;}

#ui-layer{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:200;
    padding:20px;
    pointer-events:none;
}

.screen{
    pointer-events:auto;
    display:none;
    flex-direction:column;
    gap:12px;
    background:var(--card-bg);
    border:1px solid var(--platform-border);
    border-radius:16px;
    padding:25px;
    width:95%;
    max-width:400px;
    backdrop-filter:blur(15px);
    box-shadow:0 10px 50px rgba(0,0,0,0.8);
}

.screen.active{
    display:flex;
    animation:slideIn 0.3s ease-out;
}

@keyframes slideIn{
    from{
        transform:scale(0.95);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

h1{
    color:var(--cyan);
    text-align:center;
    letter-spacing:2px;
    text-shadow:0 0 10px var(--cyan-glow);
    font-size:2rem;
}

h2{
    color:var(--cyan);
    text-align:center;
    font-size:1.4rem;
}

input{
    width:100%;
    padding:16px;
    background:rgba(0,0,0,0.6);
    border:2px solid var(--platform-border);
    border-radius:12px;
    color:white;
    font-size:1.1rem;
    text-align:center;
    outline:none;
}

.btn{
    background:var(--cyan);
    color:#000;
    border:none;
    padding:18px;
    border-radius:12px;
    font-weight:bold;
    text-transform:uppercase;
    font-size:1.1rem;
    cursor:pointer;
    width:100%;
}

.btn-secondary{
    background:transparent;
    border:1px solid var(--platform-border);
    color:var(--text);
    padding:12px;
    font-size:0.85rem;
}

#hud{
    position:absolute;
    top:env(safe-area-inset-top,10px);
    left:10px;
    right:10px;
    display:none;
    justify-content:space-between;
    font-size:0.75rem;
    z-index:150;
    pointer-events:none;
}

#hud span{
    background:rgba(13,17,23,0.8);
    padding:8px 15px;
    border-radius:30px;
    border:1px solid var(--platform-border);
    backdrop-filter:blur(5px);
}

.opt-btn{
    background:rgba(33,38,45,0.9);
    border:1px solid var(--platform-border);
    color:white;
    padding:18px;
    border-radius:10px;
    text-align:left;
    font-size:1rem;
    margin-bottom:8px;
    width:100%;
}

#mobile-controls{
    position:absolute;
    bottom:env(safe-area-inset-bottom,30px);
    left:20px;
    right:20px;
    display:flex;
    justify-content:space-between;
    z-index:300;
    pointer-events:none;
}

.ctrl-group{
    display:flex;
    gap:20px;
}

.ctrl-btn{
    width:80px;
    height:80px;
    background:rgba(0,242,255,0.15);
    border:3px solid var(--cyan);
    border-radius:50%;
    color:var(--cyan);
    display:flex;
    justify-content:center;
    align-items:center;
    pointer-events:auto;
    font-size:2.2rem;
    touch-action:none;
    backdrop-filter:blur(4px);
}

.ctrl-btn:active{
    background:var(--cyan);
    color:#000;
    transform:scale(0.9);
}

#btn-up{
    border-color:var(--success);
    color:var(--success);
    width:90px;
    height:90px;
}

#btn-up:active{
    background:var(--success);
    color:#000;
}

</style>
</head>

<body>

<div id="canvas-container">
    <canvas id="bgCanvas"></canvas>
    <canvas id="gameCanvas"></canvas>
</div>

<div id="hud">
    <span>USER: <b id="hud-user" style="color:var(--cyan)"></b></span>
    <span>LIVES: <b id="hud-lives" style="color:var(--danger)">3</b></span>
    <span>SECTOR: <b id="hud-level" style="color:var(--cyan)">1</b></span>
</div>

<div id="ui-layer">

    <div id="menu-screen" class="screen active">

        <h1>BRAIN-STORM</h1>

        <p id="hs-text"
        style="text-align:center;color:#8b949e;font-size:0.9rem;margin-bottom:5px;">
        </p>

        <input type="text"
        id="username"
        placeholder="Username..."
        maxlength="12">

        <button class="btn" onclick="startGame()">
            Initialize Mission
        </button>

        <button class="btn btn-secondary"
        onclick="toggleFullscreen()">
            Toggle Fullscreen View
        </button>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">

            <button class="btn btn-secondary"
            onclick="showScreen('how-to')">
                How to Play
            </button>

            <button class="btn btn-secondary"
            onclick="showScreen('credits')">
                Credits
            </button>

        </div>

    </div>

    <div id="how-to" class="screen">

        <h2>MISSION GUIDE</h2>

        <p>• Use On-Screen buttons to move.</p>
        <p>• Reach the <span style="color:var(--cyan)">Blue Terminal</span> to advance.</p>
        <p>• Answer correctly to jump sectors.</p>

        <button class="btn"
        onclick="showScreen('menu-screen')">
            Back
        </button>

    </div>

    <div id="credits" class="screen">

        <h2>SYSTEM CREDITS</h2>

        <p style="font-size:1.2rem;color:var(--cyan);text-align:center;">
            Rehan
        </p>

        <p style="text-align:center;color:#8b949e;">
            Lecturer from UTAS
        </p>

        <button class="btn btn-secondary"
        onclick="showScreen('menu-screen')">
            Back
        </button>

    </div>

    <div id="quiz-screen" class="screen">

        <h2 style="color:var(--cyan);margin-bottom:15px;">
            TERMINAL ACCESS
        </h2>

        <p id="q-text"
        style="margin-bottom:20px;font-size:1.1rem;line-height:1.4;">
        </p>

        <div id="opt-box"></div>

    </div>

</div>

<div id="mobile-controls" style="display:none;">

    <div class="ctrl-group">

        <div class="ctrl-btn" id="btn-left">←</div>

        <div class="ctrl-btn" id="btn-right">→</div>

    </div>

    <div class="ctrl-btn" id="btn-up">↑</div>

</div>

<script>

const AU = new (window.AudioContext || window.webkitAudioContext)();

function sfx(f,t,type='square',v=0.1){

    try{

        const osc = AU.createOscillator();
        const gain = AU.createGain();

        osc.type = type;

        osc.frequency.setValueAtTime(f,AU.currentTime);

        gain.gain.setValueAtTime(v,AU.currentTime);

        gain.gain.exponentialRampToValueAtTime(
            0.01,
            AU.currentTime+t
        );

        osc.connect(gain);

        gain.connect(AU.destination);

        osc.start();

        osc.stop(AU.currentTime+t);

    }catch(e){}
}

const questions = [

{ q:"What is the Latin root of the word 'Market'?", o:["Mercato","Tradeus","Mercatus","Marketus"], a:2 },

{ q:"A market consists of all potential customers sharing a particular:", o:["Address","Need or Want","Bank Account","Nationality"], a:1 },

{ q:"In a 'Buyer's Market', who holds the power?", o:["Sellers","Governments","Buyers","Manufacturers"], a:2 },

{ q:"The 'Exchange' process requires at least how many parties?", o:["One","Two","Three","Five"], a:1 },

{ q:"Which is a 'Place' market example?", o:["Stock Market","eBay","Regional Trade Fair","Digital Currency"], a:2 },

{ q:"Marketing is a social process by which individuals obtain what they need through:", o:["Theft","Creating/Exchanging value","Force","Saving"], a:1 },

{ q:"What is the primary goal of the 'Marketing Concept'?", o:["Maximize Sales","Customer Satisfaction","Mass Production","Product Variety"], a:1 },

{ q:"The 'Production Concept' focuses on:", o:["Quality","Customer Service","Affordability and Availability","Heavy Advertising"], a:2 },

{ q:"The 'Societal Marketing Concept' balances profits, consumer wants, and:", o:["Shareholder interests","Society's well-being","Competitor prices","Labor unions"], a:1 },

{ q:"Which concept assumes consumers will favor products with the most quality?", o:["Selling Concept","Product Concept","Marketing Concept","Global Concept"], a:1 }

];

const gCanvas = document.getElementById('gameCanvas');
const bCanvas = document.getElementById('bgCanvas');

const gctx = gCanvas.getContext('2d');
const bctx = bCanvas.getContext('2d');

function resize(){

    const height = window.visualViewport
    ? window.visualViewport.height
    : window.innerHeight;

    const width = window.visualViewport
    ? window.visualViewport.width
    : window.innerWidth;

    gCanvas.width = width;
    gCanvas.height = height;

    bCanvas.width = width;
    bCanvas.height = height;

    drawStars();
}

window.addEventListener('resize',resize);

if(window.visualViewport){
    window.visualViewport.addEventListener('resize',resize);
}

resize();

function drawStars(){

    bctx.fillStyle='#000';

    bctx.fillRect(
        0,
        0,
        bCanvas.width,
        bCanvas.height
    );

    for(let i=0;i<80;i++){

        bctx.fillStyle=`rgba(255,255,255,${Math.random()})`;

        bctx.beginPath();

        bctx.arc(
            Math.random()*bCanvas.width,
            Math.random()*bCanvas.height,
            Math.random()*1.5,
            0,
            Math.PI*2
        );

        bctx.fill();
    }
}

async function toggleFullscreen(){

    const elem = document.documentElement;

    try{

        if(
            document.fullscreenElement ||
            document.webkitFullscreenElement ||
            document.msFullscreenElement
        ){

            if(document.exitFullscreen){
                await document.exitFullscreen();
            }

            else if(document.webkitExitFullscreen){
                document.webkitExitFullscreen();
            }

            else if(document.msExitFullscreen){
                document.msExitFullscreen();
            }

        }else{

            if(elem.requestFullscreen){
                await elem.requestFullscreen();
            }

            else if(elem.webkitRequestFullscreen){
                elem.webkitRequestFullscreen();
            }

            else if(elem.msRequestFullscreen){
                elem.msRequestFullscreen();
            }

            document.body.style.height="100vh";
            document.documentElement.style.height="100vh";
            document.body.style.overflow="hidden";

            setTimeout(()=>{
                window.scrollTo(0,1);
            },300);
        }

    }catch(err){

        console.log(err);

        document.body.style.height="100vh";
        document.documentElement.style.height="100vh";
        document.body.style.overflow="hidden";

        setTimeout(()=>{
            window.scrollTo(0,1);
        },300);
    }

    setTimeout(resize,500);
}

function showScreen(id){

    document.querySelectorAll('.screen').forEach(s=>{
        s.classList.remove('active');
    });

    if(id){
        document.getElementById(id).classList.add('active');
    }

    document.getElementById('ui-layer').style.pointerEvents =
    id ? 'auto' : 'none';

    document.getElementById('mobile-controls').style.display =
    id ? 'none' : 'flex';
}

function startGame(){

    AU.resume();

    const username =
    document.getElementById('username').value.trim()
    || "REHAN";

    document.getElementById('hud-user').innerText =
    username;

    document.getElementById('hud').style.display='flex';

    showScreen(null);

    resize();

    setTimeout(()=>{
        randomQuestion();
    },1500);
}

function randomQuestion(){

    const q =
    questions[Math.floor(Math.random()*questions.length)];

    showScreen('quiz-screen');

    document.getElementById('q-text').innerText =
    q.q;

    const box =
    document.getElementById('opt-box');

    box.innerHTML='';

    q.o.forEach((opt,i)=>{

        const b = document.createElement('button');

        b.className='opt-btn';

        b.innerText=opt;

        b.onclick=()=>{

            if(i===q.a){

                sfx(1200,0.2);

                alert("Correct!");

            }else{

                sfx(50,0.4,'sawtooth');

                alert("Wrong Answer");
            }

            showScreen(null);
        };

        box.appendChild(b);
    });
}

</script>
</body>
</html>
